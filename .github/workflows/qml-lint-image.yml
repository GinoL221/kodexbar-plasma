name: Build QML lint image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qml-lint-image.yml
      - ci/qml-import-smoke.qml
      - ci/qml-lint.Dockerfile
  workflow_dispatch:

concurrency:
  group: qml-lint-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push QML lint image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ci/qml-lint.Dockerfile
          push: true
          tags: |
            ghcr.io/ginol221/kodexbar-qml-lint:qt6.11-plasma6-v1
            ghcr.io/ginol221/kodexbar-qml-lint:sha-${{ github.sha }}
          cache-from: type=gha,scope=qml-lint-image
          cache-to: type=gha,mode=max,scope=qml-lint-image
